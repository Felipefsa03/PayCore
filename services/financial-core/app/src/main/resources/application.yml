spring:
  application:
    name: paycore-financial-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DATABASE_USER:paycore}
    password: ${DATABASE_PASSWORD:paycore}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

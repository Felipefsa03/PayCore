spring:
  application:
    name: paycore-financial-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DATABASE_USER:paycore}
    password: ${DATABASE_PASSWORD:paycore}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

paycore:
  auth:
    jwt:
      # Ambiente de laboratório: o segredo abaixo é público e serve apenas para
      # execução local/testes. Em qualquer ambiente compartilhado, defina
      # PAYCORE_AUTH_JWT_SECRET com um segredo de pelo menos 32 bytes.
      issuer: ${PAYCORE_AUTH_JWT_ISSUER:paycore-lab}
      secret: ${PAYCORE_AUTH_JWT_SECRET:paycore-lab-dev-only-secret-change-me-0123456789abcdef}

spring:
  application:
    name: paycore-financial-core
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DATABASE_USER:paycore}
    password: ${DATABASE_PASSWORD:paycore}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX:32}
      minimum-idle: ${DATABASE_POOL_MIN:8}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        compression.type: lz4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

paycore:
  outbox:
    # log: transporte de laboratório; kafka: publica nos tópicos versionados.
    transport: ${PAYCORE_OUTBOX_TRANSPORT:log}
  auth:
    jwt:
      # Ambiente de laboratório: o segredo abaixo é público e serve apenas para
      # execução local/testes. Em qualquer ambiente compartilhado, defina
      # PAYCORE_AUTH_JWT_SECRET com um segredo de pelo menos 32 bytes.
      issuer: ${PAYCORE_AUTH_JWT_ISSUER:paycore-lab}
      secret: ${PAYCORE_AUTH_JWT_SECRET:paycore-lab-dev-only-secret-change-me-0123456789abcdef}
